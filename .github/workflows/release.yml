name: Release - Build & Publish Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare APK artifact
        run: |
          mkdir -p release-artifacts
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/DoBre-v${VERSION}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/*.apk

  build-windows:
    name: Build Windows App & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows ZIP & Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          
          $pubspec = Get-Content pubspec.yaml -Raw
          $Version = "1.0.0"
          if ($pubspec -match 'version:\s*([^\s+]+)') {
              $Version = $matches[1]
          }
          if ("${{ github.event.inputs.version }}") {
              $Version = "${{ github.event.inputs.version }}"
          }

          # 1. Portable ZIP
          $WinReleaseDir = "build\windows\x64\runner\Release"
          $ZipPath = "release-artifacts\DoBre-Windows-v$Version.zip"
          Compress-Archive -Path "$WinReleaseDir\*" -DestinationPath $ZipPath -Force

          # 2. Inno Setup Installer
          iscc "/DMyAppVersion=$Version" "installer\dobre_installer.iss"
          Copy-Item "dist\releases\DoBreSetup-v$Version.exe" "release-artifacts\DoBreSetup-v$Version.exe" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Compute Checksums
        run: |
          cd all-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
